<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farah Coffee | منيو</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --bg: #100C09;
    --surface: #1C1610;
    --gold: #C9A44D;
    --gold-soft: #8B7355;
    --gold-bright: #E4C486;
    --cream: #F3E9D8;
    --cream-dim: #C9BEA9;
    --line: rgba(201,164,77,0.22);
    --off: #6E6252;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, #241a10 0%, transparent 60%),
      #100C09;
    color: var(--cream);
    font-family: 'Tajawal', sans-serif;
    min-height: 100vh;
    padding-bottom: 50px;
    overflow-x: hidden;
  }
  .en{ font-family: 'Cormorant Garamond', serif; direction: ltr; }

  /* ---------- HEADER (single orchestrated entrance) ---------- */
  header{
    padding: 46px 20px 24px;
    text-align: center;
    position: relative;
  }
  .logo-wrap{
    display:flex; align-items:center; justify-content:center; gap: 18px; margin-bottom: 10px;
    opacity: 0; transform: scale(.92);
    animation: logoIn 1.1s cubic-bezier(.2,.8,.2,1) .15s forwards;
  }
  @keyframes logoIn{ to{ opacity:1; transform:scale(1); } }
  .monogram{ position: relative; width: 70px; height: 70px; font-family:'Cormorant Garamond', serif; }
  .monogram .letter-c{
    position:absolute; top: 13px; left: 7px; font-size: 38px; font-weight: 600; color: #CFA355;
    line-height: 1; clip-path: inset(0 0 0 42%);
  }
  .monogram .letter-f{
    position:absolute; top: 0px; left: 0px; font-size: 61px; font-weight: 700; color: #DDB05E;
    line-height: 1;
  }
  .brand-name{ font-family:'Cormorant Garamond', serif; font-size: 30px; letter-spacing: 3.5px; color: var(--cream); text-align: right; }
  .brand-name span{ display:block; font-size: 10.5px; letter-spacing: 4px; color: var(--gold-soft); margin-top: 4px; }
  .menu-title{
    margin-top: 16px; font-size: 13px; letter-spacing: 2px; color: var(--gold);
    display:flex; align-items:center; justify-content:center; gap:8px;
    opacity: 0; animation: fadeIn .8s ease .5s forwards;
  }
  @keyframes fadeIn{ to{ opacity:1; } }

  .hairline{
    position: relative; height: 1px; max-width: 420px; margin: 22px auto 0;
    background: var(--line); overflow:hidden;
  }
  .hairline::after{
    content:''; position:absolute; inset:0; background: linear-gradient(90deg, transparent, var(--gold), transparent);
    transform: translateX(-100%); animation: sweep 1.4s cubic-bezier(.4,0,.2,1) .3s forwards;
  }
  @keyframes sweep{ to{ transform: translateX(100%); } }

  /* ---------- NAV ---------- */
  nav{
    position: sticky; top:0; z-index: 10;
    background: rgba(16,12,9,0.9); backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    display:flex; gap: 6px; padding: 14px 16px; overflow-x:auto;
  }
  nav button{
    flex-shrink:0; background: transparent; border: 1px solid var(--line); color: var(--cream-dim);
    padding: 8px 18px; border-radius: 999px; font-family:'Tajawal'; font-size: 13px; cursor:pointer;
    transition: background .25s ease, color .25s ease, border-color .25s ease;
  }
  nav button.active{ background: var(--gold); border-color: var(--gold); color: #1a140d; font-weight:700; }

  /* ---------- MAIN / CARDS ---------- */
  main{ max-width: 640px; margin: 0 auto; padding: 28px 16px 10px; min-height: 200px; }
  .category{ display:none; }
  .category.active{ display:block; }

  .category-title{
    font-size: 15px; color: var(--gold); letter-spacing: 1px; margin: 0 0 20px;
    padding-bottom: 10px; border-bottom: 1px solid var(--line);
    display:flex; align-items:baseline; gap:10px;
  }

  .card-list{ display:flex; flex-direction:column; gap: 16px; }

  .card{
    display:flex; gap: 14px; align-items:center;
    background: var(--surface); border: 1px solid var(--line); border-radius: 14px;
    padding: 10px; overflow:hidden;
    opacity: 0; transform: translateY(14px);
    animation: cardIn .5s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes cardIn{ to{ opacity:1; transform:translateY(0); } }
  .card.unavailable{ opacity: .45 !important; animation: none; transform:none; }

  .card-media{
    width: 84px; height: 84px; flex-shrink:0; border-radius: 10px; overflow:hidden;
    background: radial-gradient(circle at 35% 30%, #2b2118, #17120c);
    display:flex; align-items:center; justify-content:center; position:relative;
    border: 1px solid rgba(201,164,77,0.18);
  }
  .card-media img{ width:100%; height:100%; object-fit:cover; display:block; cursor:pointer; }
  .card-media .glyph{ opacity:.55; }
  .card-media .glyph svg{ width:34px; height:34px; }

  .card-body{ flex:1; min-width:0; display:flex; justify-content:space-between; align-items:center; gap:10px; }
  .card-names{ display:flex; flex-direction:column; gap:3px; min-width:0; }
  .name-ar{ font-size: 15px; font-weight:500; color: var(--cream); }
  .name-en{ font-size: 11.5px; color: var(--cream-dim); letter-spacing: .5px; }
  .price{ font-size: 15px; color: var(--gold); white-space:nowrap; font-family:'Cormorant Garamond'; font-weight:700; flex-shrink:0; }
  .out-tag{ font-size: 10px; color: var(--off); background: rgba(110,98,82,0.15); padding: 3px 9px; border-radius: 999px; flex-shrink:0; }

  .state-msg{ text-align:center; padding: 40px 20px; color: var(--gold-soft); font-size: 13px; }

  footer{
    text-align:center; padding: 34px 16px 10px; font-size: 11px; color: var(--gold-soft); letter-spacing:1px;
  }

  /* ---------- LIGHTBOX ---------- */
  .lightbox{
    position: fixed; inset:0; z-index: 100; background: rgba(8,6,4,0.92);
    display:flex; align-items:center; justify-content:center; padding: 24px;
    opacity:0; pointer-events:none; transition: opacity .25s ease;
  }
  .lightbox.show{ opacity:1; pointer-events:auto; }
  .lightbox img{
    max-width: 100%; max-height: 85vh; border-radius: 14px;
    border: 1px solid var(--line); box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    transform: scale(.92); transition: transform .25s cubic-bezier(.2,.8,.2,1);
  }
  .lightbox.show img{ transform: scale(1); }
  .lightbox-close{
    position: absolute; top: 22px; left: 50%; transform: translateX(-50%);
    background: var(--surface); border: 1px solid var(--line); color: var(--gold);
    width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor:pointer;
    display:flex; align-items:center; justify-content:center;
  }

  @media (prefers-reduced-motion: reduce){
    .logo-wrap, .menu-title, .hairline::after, .card{ animation: none !important; opacity:1 !important; transform:none !important; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-wrap">
    <div class="brand-name">FARAH COFFEE<span>ELEGANT SPACE FOR YOU</span></div>
    <div class="monogram">
      <span class="letter-c">C</span>
      <span class="letter-f">F</span>
    </div>
  </div>
  <div class="menu-title"><span class="bean">۞</span> MENU | منيو <span class="bean">۞</span></div>
  <div class="hairline"></div>
</header>

<nav id="catNav"></nav>

<main id="menuMain">
  <div class="state-msg">جاري تحميل المنيو...</div>
</main>

<footer>0917677748 ۞ 0126977100 ۞ 0126894319</footer>

<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close" onclick="closeLightbox()">✕</button>
  <img id="lightboxImg" src="" alt="">
</div>

<script>
// ---- Supabase connection ----
const SUPABASE_URL = 'https://omyucnjkqeyomtvijqwc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9teXVjbmprcWV5b210dmlqcXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTQ0NDUsImV4cCI6MjEwNDEzMDQ0NX0.jc8WAbBIpMCDzdLCf3RYk9ruLbInBJ7unmnr2u1SEkA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CATEGORY_LABELS = {
  hot:   { ar: 'المشروبات الساخنة', en: 'Hot Drinks' },
  cold:  { ar: 'المشروبات الباردة', en: 'Cold Drinks' },
  shake: { ar: 'ميلك شيك',          en: 'Milkshake' },
  snacks:{ ar: 'الوجبات الخفيفة',   en: 'Snacks' },
};
const CATEGORY_ORDER = ['hot', 'cold', 'shake', 'snacks'];

// A simple elegant cup glyph used whenever an item has no photo yet
const CUP_GLYPH = `<span class="glyph"><svg viewBox="0 0 48 48" fill="none" xmlns="http://www.w3.org/2000/svg">
  <path d="M10 18h22v14a8 8 0 0 1-8 8h-6a8 8 0 0 1-8-8V18Z" stroke="#C9A44D" stroke-width="1.4"/>
  <path d="M32 21h3a5 5 0 0 1 0 10h-3" stroke="#C9A44D" stroke-width="1.4"/>
  <path d="M15 12c0-1.5 1.2-2 1.2-3.5S15 6 15 6" stroke="#C9A44D" stroke-width="1.2" stroke-linecap="round"/>
  <path d="M21 12c0-1.5 1.2-2 1.2-3.5S21 6 21 6" stroke="#C9A44D" stroke-width="1.2" stroke-linecap="round"/>
</svg></span>`;

const nav = document.getElementById('catNav');
const mainEl = document.getElementById('menuMain');
let currentCat = null;

async function loadMenu(){
  const { data, error } = await sb
    .from('items')
    .select('*')
    .order('sort_order', { ascending: true });

  if(error){
    mainEl.innerHTML = `<div class="state-msg">تعذّر تحميل المنيو حاليًا، حاول تاني بعد شوية.</div>`;
    console.error(error);
    return;
  }

  render(data || []);
}

function render(items){
  const groups = {};
  items.forEach(it => {
    if(!groups[it.category]) groups[it.category] = [];
    groups[it.category].push(it);
  });

  const activeCats = CATEGORY_ORDER.filter(c => groups[c] && groups[c].length);

  if(!activeCats.length){
    mainEl.innerHTML = `<div class="state-msg">المنيو فاضي دلوقتي.</div>`;
    nav.innerHTML = '';
    return;
  }

  if(!currentCat || !activeCats.includes(currentCat)) currentCat = activeCats[0];

  nav.innerHTML = activeCats.map(c => `
    <button data-cat="${c}" class="${c === currentCat ? 'active' : ''}">${CATEGORY_LABELS[c].ar}</button>
  `).join('');

  nav.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => { currentCat = btn.dataset.cat; render(items); };
  });

  mainEl.innerHTML = activeCats.map(c => `
    <section class="category ${c === currentCat ? 'active' : ''}">
      <h2 class="category-title">${CATEGORY_LABELS[c].ar} <span class="en">— ${CATEGORY_LABELS[c].en}</span></h2>
      <div class="card-list">
        ${groups[c].map((it, i) => cardHtml(it, i)).join('')}
      </div>
    </section>
  `).join('');
}

function cardHtml(it, i){
  const delay = Math.min(i * 55, 500);
  return `
  <div class="card ${it.available ? '' : 'unavailable'}" style="animation-delay:${delay}ms">
    <div class="card-media">
      ${it.image_url ? `<img src="${escapeAttr(it.image_url)}" alt="" loading="lazy" onclick="openLightbox('${escapeAttr(it.image_url)}')">` : CUP_GLYPH}
    </div>
    <div class="card-body">
      <div class="card-names">
        <div class="name-ar">${escapeHtml(it.name_ar)}</div>
        <div class="name-en en">${escapeHtml((it.name_en || '').toUpperCase())}</div>
      </div>
      ${it.available ? `<div class="price">${it.price} ج.م</div>` : `<div class="out-tag">خلص النهاردة</div>`}
    </div>
  </div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function escapeAttr(str){ return escapeHtml(str); }

function openLightbox(url){
  const lb = document.getElementById('lightbox');
  document.getElementById('lightboxImg').src = url;
  lb.classList.add('show');
}
function closeLightbox(){
  document.getElementById('lightbox').classList.remove('show');
}

// Initial load
loadMenu();

// Realtime: re-render instantly whenever admin changes anything in "items"
sb.channel('public:items')
  .on('postgres_changes', { event: '*', schema: 'public', table: 'items' }, () => {
    loadMenu();
  })
  .subscribe();
</script>
</body>
</html>
