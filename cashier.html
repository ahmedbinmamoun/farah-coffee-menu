<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farah Coffee | نظام الكاشير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
<style>
  :root{
    --bg:#100C09; --surface:#1C1610; --surface-2:#241C13;
    --gold:#C9A44D; --gold-soft:#8B7355; --cream:#F3E9D8; --cream-dim:#C9BEA9;
    --line: rgba(201,164,77,0.22); --success:#7FA66B; --danger:#B15B52; --off:#6E6252;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:#100C09; color:var(--cream); font-family:'Tajawal', sans-serif;
    min-height:100vh; padding-bottom: 20px;
  }
  .en{ font-family:'Cormorant Garamond', serif; direction:ltr; }
  button{ font-family:'Tajawal', sans-serif; cursor:pointer; }
  input{ font-family:'Tajawal', sans-serif; }
  .hidden{ display:none !important; }

  /* ---------- LOGIN ---------- */
  .login-screen{ min-height:100vh; display:flex; align-items:center; justify-content:center; padding:20px; }
  .login-box{ width:100%; max-width:360px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:30px 26px; }
  .login-box h2{ margin:0 0 4px; font-size:18px; text-align:center; }
  .login-box .sub{ font-size:12px; color:var(--gold-soft); text-align:center; margin-bottom:22px; }
  .emp-grid{ display:flex; flex-direction:column; gap:10px; margin-bottom:16px; max-height: 220px; overflow-y:auto; }
  .emp-btn{
    background:var(--surface-2); border:1px solid var(--line); color:var(--cream);
    padding:12px; border-radius:10px; font-size:14px; text-align:center;
  }
  .emp-btn.selected{ border-color:var(--gold); background: rgba(201,164,77,0.12); color:var(--gold); }
  .pin-input{
    width:100%; background:var(--surface-2); border:1px solid var(--line); color:var(--cream);
    border-radius:8px; padding:12px; font-size:20px; text-align:center; letter-spacing:8px; margin-bottom:14px;
  }
  .login-box .go-btn{
    width:100%; background:var(--gold); color:#1a140d; border:none; padding:12px; border-radius:8px;
    font-size:14px; font-weight:700;
  }
  .login-error{ color:#d98a80; font-size:12px; text-align:center; margin-top:12px; display:none; }
  .login-error.show{ display:block; }
  .state-msg{ text-align:center; padding: 20px; color: var(--gold-soft); font-size: 13px; grid-column: 1/-1; }

  /* ---------- APP ---------- */
  header{
    padding:16px 18px; border-bottom:1px solid var(--line);
    display:flex; align-items:center; justify-content:space-between; gap:10px; flex-wrap:wrap;
    position:sticky; top:0; background:rgba(16,12,9,0.95); backdrop-filter:blur(6px); z-index:20;
  }
  header .who{ font-size:14px; }
  header .who b{ color:var(--gold); }
  header .who .admin-tag{ font-size:10px; color:#1a140d; background:var(--gold); padding:2px 8px; border-radius:999px; margin-right:6px; }
  .header-actions{ display:flex; gap:8px; flex-wrap:wrap; }
  .pill-btn{
    background:var(--surface); border:1px solid var(--line); color:var(--cream-dim);
    padding:7px 14px; border-radius:999px; font-size:12px;
  }
  .pill-btn.danger{ color:#d98a80; border-color: rgba(177,91,82,0.4); }

  nav.cat-nav{
    display:flex; gap:6px; padding:12px 14px; overflow-x:auto;
    border-bottom:1px solid var(--line);
  }
  nav.cat-nav button{
    flex-shrink:0; background:transparent; border:1px solid var(--line); color:var(--cream-dim);
    padding:8px 16px; border-radius:999px; font-size:13px;
  }
  nav.cat-nav button.active{ background:var(--gold); border-color:var(--gold); color:#1a140d; font-weight:700; }

  main{ max-width: 720px; margin:0 auto; padding: 16px 14px 220px; }
  .items-grid{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; }
  .item-card{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:12px; display:flex; flex-direction:column; gap:8px;
  }
  .item-card.has-qty{ border-color: var(--gold); }
  .item-card .nm{ font-size:13.5px; color:var(--cream); }
  .item-card .pr{ font-size:14px; color:var(--gold); font-family:'Cormorant Garamond'; font-weight:700; }
  .qty-row{ display:flex; align-items:center; justify-content:space-between; gap:6px; }
  .qty-row button{
    width:32px; height:32px; border-radius:8px; background:var(--surface-2); border:1px solid var(--line); color:var(--gold);
    font-size:17px; display:flex; align-items:center; justify-content:center; flex-shrink:0;
  }
  .qty-row button.plus{ color:#1a140d; background:var(--gold); }
  .qty-row .q{ font-size:15px; font-weight:700; min-width:20px; text-align:center; }

  /* ---------- CART BAR ---------- */
  .cart-bar{
    position:fixed; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
    z-index:30; max-height: 70vh; display:flex; flex-direction:column;
  }
  .cart-summary{ display:flex; align-items:center; justify-content:space-between; padding:14px 18px; cursor:pointer; }
  .cart-summary .count{ font-size:13px; color:var(--cream-dim); }
  .cart-summary .total{ font-size:18px; color:var(--gold); font-family:'Cormorant Garamond'; font-weight:700; }
  .cart-list{ overflow-y:auto; padding:0 18px; border-top:1px solid var(--line); display:none; }
  .cart-bar.open .cart-list{ display:block; }
  .cart-row{ display:flex; align-items:center; justify-content:space-between; gap:10px; padding:10px 0; border-bottom:1px dashed rgba(201,164,77,0.14); }
  .cart-row .nm{ font-size:13px; flex:1; }
  .line-total{ font-size:13px; color:var(--gold); font-family:'Cormorant Garamond'; font-weight:700; width:52px; text-align:left; }

  .cart-actions{ display:flex; gap:10px; padding:14px 18px; }
  .cart-actions button{ flex:1; padding:12px; border-radius:8px; font-size:13.5px; font-weight:700; border:none; }
  .btn-cancel{ background:var(--surface-2); color:#d98a80; border:1px solid rgba(177,91,82,0.4) !important; }
  .btn-checkout{ background:var(--gold); color:#1a140d; }
  .btn-checkout:disabled{ opacity:.4; }

  /* ---------- MODALS ---------- */
  .modal-overlay{ position:fixed; inset:0; background:rgba(8,6,4,0.85); z-index:50; display:flex; align-items:center; justify-content:center; padding:20px; }
  .modal-box{ width:100%; max-width:400px; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:24px; max-height:85vh; overflow-y:auto; }
  .modal-box h3{ margin:0 0 16px; font-size:16px; text-align:center; }
  .pay-options{ display:flex; gap:12px; margin-bottom:16px; }
  .pay-options button{ flex:1; padding:16px 10px; border-radius:10px; background:var(--surface-2); border:1px solid var(--line); color:var(--cream); font-size:13.5px; display:flex; flex-direction:column; align-items:center; gap:6px; }
  .pay-options button.selected{ border-color:var(--gold); color:var(--gold); background:rgba(201,164,77,0.12); }
  .modal-total{ text-align:center; font-size:22px; color:var(--gold); font-family:'Cormorant Garamond'; font-weight:700; margin-bottom:16px; }
  .modal-box .confirm-btn{ width:100%; background:var(--gold); color:#1a140d; border:none; padding:12px; border-radius:8px; font-weight:700; font-size:14px; margin-top:6px; }
  .modal-box .close-btn{ width:100%; background:transparent; color:var(--cream-dim); border:1px solid var(--line); padding:10px; border-radius:8px; font-size:13px; margin-top:10px; }
  .modal-box .secondary-btn{ width:100%; background:var(--surface-2); color:var(--gold); border:1px solid var(--line); padding:12px; border-radius:8px; font-weight:700; font-size:13.5px; margin-top:8px; }

  .invoice-item{ border:1px solid var(--line); border-radius:10px; padding:12px; margin-bottom:10px; font-size:12.5px; }
  .invoice-item.cancelled{ opacity:.4; }
  .invoice-item .top-row{ display:flex; justify-content:space-between; margin-bottom:6px; color:var(--gold); font-weight:700; }
  .invoice-item .meta{ color:var(--cream-dim); font-size:11.5px; margin-bottom:6px; }
  .invoice-item .void-btn{ background:transparent; border:1px solid rgba(177,91,82,0.4); color:#d98a80; font-size:11px; padding:5px 10px; border-radius:6px; margin-top:6px; }

  .report-table{ width:100%; border-collapse:collapse; font-size:12.5px; margin-bottom:14px; }
  .report-table th, .report-table td{ padding:8px 6px; text-align:center; border-bottom:1px solid var(--line); }
  .report-table th{ color:var(--gold); }
  .report-table tfoot td{ font-weight:700; color:var(--gold); }

  .emp-manage-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px dashed rgba(201,164,77,0.14); font-size:13px; }
  .emp-manage-row .tag{ font-size:10px; color:#1a140d; background:var(--gold); padding:1px 7px; border-radius:999px; margin-right:6px; }
  .emp-manage-row .del-btn{ background:transparent; border:1px solid rgba(177,91,82,0.4); color:#d98a80; font-size:11px; padding:5px 9px; border-radius:6px; }
  .add-emp-form{ display:flex; flex-direction:column; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .add-emp-form input{ background:var(--surface-2); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:9px 10px; font-size:13px; }
  .add-emp-form label{ font-size:12px; color:var(--cream-dim); display:flex; align-items:center; gap:6px; }

  .expense-row{ display:flex; align-items:center; justify-content:space-between; gap:8px; padding:10px 0; border-bottom:1px dashed rgba(201,164,77,0.14); font-size:12.5px; }
  .expense-row .info{ display:flex; flex-direction:column; gap:2px; }
  .expense-row .amt{ color:var(--gold); font-family:'Cormorant Garamond'; font-weight:700; font-size:14px; }
  .expense-row .meta{ color:var(--cream-dim); font-size:11px; }
  .expense-row .del-btn{ background:transparent; border:1px solid rgba(177,91,82,0.4); color:#d98a80; font-size:11px; padding:5px 9px; border-radius:6px; }
  .add-expense-form{ display:flex; flex-direction:column; gap:8px; margin-top:14px; padding-top:14px; border-top:1px solid var(--line); }
  .add-expense-form input{ background:var(--surface-2); border:1px solid var(--line); color:var(--cream); border-radius:8px; padding:9px 10px; font-size:13px; }
</style>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>نظام الكاشير</h2>
    <div class="sub">Farah Coffee — تسجيل دخول الموظف</div>
    <div class="emp-grid" id="empGrid"><div class="state-msg">جاري تحميل الموظفين...</div></div>
    <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="go-btn" onclick="doLogin()">دخول</button>
    <div class="login-error" id="loginError">الاسم أو الـ PIN غلط</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="who"><span id="adminTag"></span>شغّال حاليا: <b id="whoName"></b></div>
    <div class="header-actions">
      <button class="pill-btn" onclick="openInvoices()">فواتير الليلة</button>
      <button class="pill-btn" onclick="openExpenses()">المصروفات</button>
      <button class="pill-btn" onclick="openReport()">تقرير اليوم</button>
      <button class="pill-btn hidden" id="manageEmpBtn" onclick="openManageEmployees()">الموظفين</button>
      <button class="pill-btn danger" onclick="doLogout()">إنهاء الشيفت</button>
    </div>
  </header>

  <nav class="cat-nav" id="catNav"></nav>

  <main>
    <div class="items-grid" id="itemsGrid">
      <div class="state-msg">جاري تحميل المنيو...</div>
    </div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="cart-summary" onclick="toggleCart()">
      <span class="count" id="cartCount">السلة فاضية</span>
      <span class="total" id="cartTotalTop">0 ج</span>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-actions">
      <button class="btn-cancel" onclick="clearCart()">إلغاء الطلب</button>
      <button class="btn-checkout" id="checkoutBtn" onclick="openPaymentModal()" disabled>إتمام البيع</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script>
// ---- Supabase ----
const SUPABASE_URL = 'https://omyucnjkqeyomtvijqwc.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im9teXVjbmprcWV5b210dmlqcXdjIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODg1NTQ0NDUsImV4cCI6MjEwNDEzMDQ0NX0.jc8WAbBIpMCDzdLCf3RYk9ruLbInBJ7unmnr2u1SEkA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// Fill this in after deploying the Edge Function (see EDGE_FUNCTION_SETUP.md)
const TELEGRAM_FUNCTION_URL = 'https://omyucnjkqeyomtvijqwc.supabase.co/functions/v1/send-telegram-report';

const CATEGORY_LABELS = {
  hot:   { ar: 'المشروبات الساخنة', en: 'Hot Drinks' },
  cold:  { ar: 'المشروبات الباردة', en: 'Cold Drinks' },
  shake: { ar: 'ميلك شيك',          en: 'Milkshake' },
};
const CATEGORY_ORDER = ['hot', 'cold', 'shake'];

const LS_INVOICES = 'pos_invoices_v1';
const LS_COUNTER  = 'pos_daily_counter_v1';
const LS_EXPENSES = 'pos_expenses_v1';

let employees = [];
let menuItems = [];
let currentCat = null;
let cart = []; // { name_ar, price, qty }
let currentEmployee = null; // { id, name, is_admin }
let selectedEmpId = null;

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}
function todayStr(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}

// ================= LOGIN =================
async function loadEmployees(){
  const { data, error } = await sb.from('pos_employees').select('*').order('id');
  const empGrid = document.getElementById('empGrid');
  if(error){
    empGrid.innerHTML = '<div class="state-msg">تعذّر تحميل قائمة الموظفين</div>';
    console.error(error);
    return;
  }
  employees = data || [];
  empGrid.innerHTML = '';
  employees.forEach(emp => {
    const btn = document.createElement('button');
    btn.className = 'emp-btn';
    btn.textContent = emp.name + (emp.is_admin ? ' (أدمن)' : '');
    btn.onclick = () => {
      selectedEmpId = emp.id;
      document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('selected'));
      btn.classList.add('selected');
    };
    empGrid.appendChild(btn);
  });
}

function doLogin(){
  const pin = document.getElementById('pinInput').value.trim();
  const errEl = document.getElementById('loginError');
  const emp = employees.find(e => e.id === selectedEmpId && String(e.pin) === pin);
  if(!emp){
    errEl.classList.add('show');
    return;
  }
  errEl.classList.remove('show');
  currentEmployee = emp;
  document.getElementById('loginScreen').classList.add('hidden');
  document.getElementById('app').classList.remove('hidden');
  document.getElementById('whoName').textContent = currentEmployee.name;
  document.getElementById('adminTag').innerHTML = currentEmployee.is_admin ? '<span class="admin-tag">أدمن</span>' : '';
  document.getElementById('manageEmpBtn').classList.toggle('hidden', !currentEmployee.is_admin);
  document.getElementById('pinInput').value = '';
  loadMenu();
}

function doLogout(){
  if(cart.length && !confirm('السلة لسه فيها أصناف، متأكد إنك عايز تنهي الشيفت؟')) return;
  currentEmployee = null;
  cart = [];
  document.getElementById('app').classList.add('hidden');
  document.getElementById('loginScreen').classList.remove('hidden');
  selectedEmpId = null;
  document.querySelectorAll('.emp-btn').forEach(b => b.classList.remove('selected'));
}

// ================= MENU =================
async function loadMenu(){
  const { data, error } = await sb.from('items').select('*').eq('available', true).order('sort_order');
  if(error){
    document.getElementById('itemsGrid').innerHTML = '<div class="state-msg">تعذّر تحميل المنيو</div>';
    console.error(error);
    return;
  }
  menuItems = data || [];
  renderCats();
}

function renderCats(){
  const groups = {};
  menuItems.forEach(it => { (groups[it.category] ||= []).push(it); });
  const activeCats = CATEGORY_ORDER.filter(c => groups[c] && groups[c].length);
  if(!currentCat || !activeCats.includes(currentCat)) currentCat = activeCats[0];

  const nav = document.getElementById('catNav');
  nav.innerHTML = activeCats.map(c => `<button data-c="${c}" class="${c===currentCat?'active':''}">${CATEGORY_LABELS[c].ar}</button>`).join('');
  nav.querySelectorAll('button').forEach(b => b.onclick = () => { currentCat = b.dataset.c; renderCats(); });

  const grid = document.getElementById('itemsGrid');
  const list = groups[currentCat] || [];
  grid.innerHTML = list.map(it => itemCardHtml(it)).join('') || '<div class="state-msg">مافي أصناف متاحة في القسم ده</div>';
}

function qtyInCart(name_ar, price){
  const row = cart.find(c => c.name_ar === name_ar && c.price === price);
  return row ? row.qty : 0;
}

function itemCardHtml(it){
  const qty = qtyInCart(it.name_ar, it.price);
  return `
  <div class="item-card ${qty > 0 ? 'has-qty' : ''}">
    <span class="nm">${escapeHtml(it.name_ar)}</span>
    <span class="pr">${it.price} ج</span>
    <div class="qty-row">
      <button onclick="cardChangeQty('${escapeAttr(it.name_ar)}', ${it.price}, -1)">−</button>
      <span class="q">${qty}</span>
      <button class="plus" onclick="cardChangeQty('${escapeAttr(it.name_ar)}', ${it.price}, 1)">+</button>
    </div>
  </div>`;
}
function escapeAttr(str){ return String(str).replace(/'/g, "\\'"); }

// ================= CART =================
function cardChangeQty(name_ar, price, delta){
  let row = cart.find(c => c.name_ar === name_ar && c.price === price);
  if(!row && delta > 0){
    cart.push({ name_ar, price, qty: 1 });
  }else if(row){
    row.qty += delta;
    if(row.qty <= 0) cart = cart.filter(c => c !== row);
  }
  renderCart();
  renderCats(); // refresh quantities shown on the product cards
}

function removeRow(idx){
  cart.splice(idx, 1);
  renderCart();
  renderCats();
}

function cartTotal(){
  return cart.reduce((s,c) => s + c.price*c.qty, 0);
}

function renderCart(){
  const countEl = document.getElementById('cartCount');
  const totalEl = document.getElementById('cartTotalTop');
  const listEl = document.getElementById('cartList');
  const checkoutBtn = document.getElementById('checkoutBtn');

  const totalQty = cart.reduce((s,c)=>s+c.qty,0);
  countEl.textContent = totalQty ? `${totalQty} صنف في السلة` : 'السلة فاضية';
  totalEl.textContent = cartTotal() + ' ج';
  checkoutBtn.disabled = cart.length === 0;

  listEl.innerHTML = cart.map((c,i) => `
    <div class="cart-row">
      <div class="nm">${escapeHtml(c.name_ar)} × ${c.qty}</div>
      <div class="line-total">${c.price*c.qty}</div>
      <button class="btn-cancel" style="flex:none; padding:4px 10px;" onclick="removeRow(${i})">✕</button>
    </div>
  `).join('');
}

function toggleCart(){ document.getElementById('cartBar').classList.toggle('open'); }

function clearCart(){
  if(!cart.length) return;
  if(!confirm('تفريغ السلة بالكامل؟')) return;
  cart = [];
  renderCart();
  renderCats();
}

// ================= INVOICES (localStorage — single fixed device) =================
function getInvoices(){
  try{ return JSON.parse(localStorage.getItem(LS_INVOICES)) || []; }catch(e){ return []; }
}
function saveInvoices(list){ localStorage.setItem(LS_INVOICES, JSON.stringify(list)); }

function nextInvoiceNumber(){
  let counter;
  try{ counter = JSON.parse(localStorage.getItem(LS_COUNTER)); }catch(e){ counter = null; }
  const today = todayStr();
  if(!counter || counter.date !== today) counter = { date: today, count: 0 };
  counter.count += 1;
  localStorage.setItem(LS_COUNTER, JSON.stringify(counter));
  return counter.count;
}

let pendingPayment = null;

function openPaymentModal(){
  if(!cart.length) return;
  pendingPayment = null;
  const total = cartTotal();
  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>طريقة الدفع</h3>
        <div class="modal-total">${total} ج</div>
        <div class="pay-options">
          <button id="payCash" onclick="selectPayment('cash')">💵 كاش</button>
          <button id="payCard" onclick="selectPayment('card')">💳 بنكك</button>
        </div>
        <button class="confirm-btn" onclick="confirmSale()">تأكيد البيع</button>
        <button class="close-btn" onclick="closeModal()">رجوع</button>
      </div>
    </div>`;
}
function selectPayment(method){
  pendingPayment = method;
  document.getElementById('payCash').classList.toggle('selected', method==='cash');
  document.getElementById('payCard').classList.toggle('selected', method==='card');
}

function confirmSale(){
  if(!pendingPayment){ alert('اختار طريقة الدفع الأول'); return; }
  const invoices = getInvoices();
  const num = nextInvoiceNumber();
  const now = new Date();
  const invoice = {
    id: todayStr() + '-' + num,
    number: num,
    date: todayStr(),
    time: now.toLocaleTimeString('ar-EG', { hour:'2-digit', minute:'2-digit' }),
    employee: currentEmployee.name,
    items: cart.map(c => ({...c})),
    total: cartTotal(),
    payment: pendingPayment,
    status: 'active'
  };
  invoices.push(invoice);
  saveInvoices(invoices);
  cart = [];
  renderCart();
  renderCats();
  document.getElementById('cartBar').classList.remove('open');
  closeModal();
  alert(`تم البيع — فاتورة رقم ${invoice.number} بقيمة ${invoice.total} ج`);
}

// ================= REPORTS =================
function computeDayAggregation(dateStr){
  const invoices = getInvoices().filter(i => i.date === dateStr && i.status !== 'cancelled');
  const byEmployee = {}; // { name: { count, cash, card, total, items: { name_ar: qty } } }
  let grandTotal=0, grandCash=0, grandCard=0;

  invoices.forEach(inv => {
    if(!byEmployee[inv.employee]) byEmployee[inv.employee] = { count:0, cash:0, card:0, total:0, items:{} };
    const e = byEmployee[inv.employee];
    e.count++; e.total += inv.total;
    if(inv.payment === 'cash'){ e.cash += inv.total; grandCash += inv.total; }
    else { e.card += inv.total; grandCard += inv.total; }
    grandTotal += inv.total;
    inv.items.forEach(it => {
      e.items[it.name_ar] = (e.items[it.name_ar] || 0) + it.qty;
    });
  });

  return { byEmployee, grandTotal, grandCash, grandCard, count: invoices.length };
}

function openReport(dateStr){
  const selectedDate = dateStr || todayStr();
  const agg = computeDayAggregation(selectedDate);
  const isAdmin = currentEmployee.is_admin;

  if(!isAdmin){

  const rows = Object.entries(agg.byEmployee).map(([name, e]) => `
    <tr><td>${escapeHtml(name)}</td><td>${e.count}</td><td>${e.cash}</td><td>${e.card}</td><td>${e.total}</td></tr>
  `).join('') || `<tr><td colspan="5">مفيش مبيعات في اليوم ده</td></tr>`;

  const expensesTotal = todayExpensesTotal(selectedDate);
  const netProfit = agg.grandTotal - expensesTotal;

  document.getElementById('modalRoot').innerHTML = `
    <div class="modal-overlay">
      <div class="modal-box">
        <h3>تقرير يوم <span class="en">${selectedDate}</span></h3>
        <div style="display:flex; align-items:center; gap:8px; margin-bottom:16px;">
          <label style="font-size:12px; color:var(--cream-dim); flex-shrink:0;">اختار يوم تاني:</label>
          <input type="date" id="reportDatePicker" value="${selectedDate}" max="${todayStr()}"

            onchange="openReport(this.value)">
        </div>
        <table class="report-table">
          <thead><tr><th>الموظف</th><th>الفواتير</th><th>كاش</th><th>بنكك</th><th>الإجمالي</th></tr></thead>
          <tbody>${rows}</tbody>
          <tfoot><tr><td>الإجمالي الكلي</td><td>${agg.count}</td><td>${agg.grandCash}</td><td>${agg.grandCard}</td><td>${agg.grandTotal}</td></tr></tfoot>
        </table>
        <table class="report-table">
          <tr><td>إجمالي المبيعات</td><td>${agg.grandTotal} ج</td></tr>
          <tr><td>إجمالي المصروفات</td><td>${expensesTotal} ج</td></tr>
          <tr><td><b>صافي الربح</b></td><td><b>${netProfit} ج</b></td></tr>
        </table>
        <button class="secondary-btn" onclick="downloadExcelReport('${selectedDate}')">تحميل ملف إكسيل</button>
        <button class="confirm-btn" onclick="sendReportToTelegram('${selectedDate}')" id="sendTgBtn">إرسال لتليجرام</button>
        <button class="close-btn" onclick="closeModal()">قفل</button>
      </div>
    </div>`;
}

// ---- Build the Excel workbook: one sheet, each employee's items + qty, then grand total ----
async function buildReportWorkbook(dateStr){
  const agg = computeDayAggregation(dateStr);
  const rows = [];
  rows.push(['تقرير مبيعات Farah Coffee', dateStr]);
  rows.push([]);

  // Column list = every menu item (even currently-unavailable ones), in category order
  const { data: allItems, error: itemsErr } = await sb.from('items').select('*').order('sort_order');
  const sourceItems = itemsErr ? menuItems : (allItems || []);
  const sortedItems = CATEGORY_ORDER.flatMap(cat => sourceItems.filter(it => it.category === cat));
  const itemNames = sortedItems.map(it => it.name_ar);

  const header = ['اسم الموظف', ...itemNames, 'كاش', 'بنكك', 'إجمالي الموظف'];
  rows.push(header);

  const employeeNames = Object.keys(agg.byEmployee);
  const itemColumnTotals = itemNames.map(() => 0);

  employeeNames.forEach(name => {
    const e = agg.byEmployee[name];
    const qtyCells = itemNames.map((itemName, i) => {
      const qty = e.items[itemName] || 0;
      itemColumnTotals[i] += qty;
      return qty;
    });
    rows.push([name, ...qtyCells, e.cash, e.card, e.total]);
  });

  rows.push(['الإجمالي', ...itemColumnTotals, agg.grandCash, agg.grandCard, agg.grandTotal]);
  rows.push([]);

  // Expenses: one standalone section, not attributed to any employee row
  const expenses = getExpenses().filter(e => e.date === dateStr);
  const expensesTotal = expenses.reduce((s,e) => s + e.amount, 0);
  rows.push(['المصروفات']);
  rows.push(['اسم المصروف', 'المبلغ', 'الموظف اللي ضافه', 'ملحوظة']);
  expenses.forEach(e => {
    rows.push([e.name, e.amount, e.employee, e.note || '']);
  });
  rows.push(['إجمالي المصروفات', expensesTotal]);
  rows.push([]);

  rows.push(['صافي الربح', agg.grandTotal - expensesTotal]);

  const ws = XLSX.utils.aoa_to_sheet(rows);
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, 'التقرير');
  return wb;
}

async function downloadExcelReport(dateStr){
  const wb = await buildReportWorkbook(dateStr);
  XLSX.writeFile(wb, `farah-coffee-report-${dateStr}.xlsx`);
}

async function sendReportToTelegram(dateStr){
  const btn = document.getElementById('sendTgBtn');
  btn.disabled = true;
  btn.textContent = 'جاري الإرسال...';

  try{
    const wb = await buildReportWorkbook(dateStr);
    const wbout = XLSX.write(wb, { bookType: 'xlsx', type: 'base64' });

    const res = await fetch(TELEGRAM_FUNCTION_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        filename: `farah-coffee-report-${dateStr}.xlsx`,
        fileBase64: wbout,
        caption: `تقرير مبيعات Farah Coffee - ${dateStr}`
      })
    });
    const json = await res.json();
    if(!res.ok || json.error){
      throw new Error(json.error || 'فشل الإرسال');
    }
    btn.textContent = '✓ اتبعت لتليجرام';
  }catch(err){
    console.error(err);
    btn.textContent = 'حصل خطأ، جرب تاني';
    btn.disabled = false;
  }
}

async function addEmployee(){
  const name = document.getElementById('newEmpName').value.trim();
  const pin = document.getElementById('newEmpPin').value.trim();
  const is_admin = document.getElementById('newEmpAdmin').checked;
  if(!name || !pin){ alert('لازم اسم و PIN'); return; }

  const { error } = await sb.from('pos_employees').insert({ name, pin, is_admin });
  if(error){ alert('حصل خطأ في الإضافة'); console.error(error); return; }
  await loadEmployees();
  renderManageEmployeesModal();
}

async function deleteEmployee(id){
  if(!confirm('متأكد إنك عايز تحذف الموظف ده؟')) return;
  const { error } = await sb.from('pos_employees').delete().eq('id', id);
  if(error){ alert('حصل خطأ في الحذف'); console.error(error); return; }
  await loadEmployees();
  renderManageEmployeesModal();
}
