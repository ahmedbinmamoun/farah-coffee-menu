<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Farah Coffee | نظام الكاشير</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;800&family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/cashier.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>
</head>
<body>

<!-- LOGIN -->
<div class="login-screen" id="loginScreen">
  <div class="login-box">
    <h2>نظام الكاشير</h2>
    <div class="sub">Farah Coffee — تسجيل دخول الموظف</div>
    <div class="emp-grid" id="empGrid"><div class="state-msg">جاري تحميل الموظفين...</div></div>
    <input class="pin-input" id="pinInput" type="password" inputmode="numeric" maxlength="6" placeholder="••••">
    <button class="go-btn" data-action="auth:login">دخول</button>
    <div class="login-error" id="loginError">الاسم أو الـ PIN غلط</div>
  </div>
</div>

<!-- APP -->
<div id="app" class="hidden">
  <header>
    <div class="who"><span id="adminTag"></span>شغّال حاليا: <b id="whoName"></b></div>
    <div class="header-actions">
      <button class="pill-btn accent" data-action="tables:openScreen">الترابيزات</button>
      <button class="pill-btn accent" data-action="takeaway:start">تيك أواي</button>
      <button class="pill-btn" data-action="held:openScreen">الفواتير المعلّقة</button>
      <button class="pill-btn" data-action="invoices:openScreen">فواتير الليلة</button>
      <button class="pill-btn" data-action="expenses:openScreen">المصروفات</button>
      <button class="pill-btn" data-action="reports:openScreen">تقرير اليوم</button>
      <button class="pill-btn hidden" id="manageEmpBtn" data-action="emp:openScreen">الموظفين</button>
      <button class="pill-btn danger" data-action="auth:logout">إنهاء الشيفت</button>
    </div>
  </header>

  <div class="session-banner hidden" id="sessionBanner">
    <span id="sessionBannerText"></span>
    <button data-action="cart:backToDirectSale">رجوع للبيع المباشر</button>
  </div>

  <nav class="cat-nav" id="catNav"></nav>

  <main>
    <div class="items-grid" id="itemsGrid">
      <div class="state-msg">جاري تحميل المنيو...</div>
    </div>
  </main>

  <div class="cart-bar" id="cartBar">
    <div class="cart-summary" data-action="cart:toggle">
      <span class="count" id="cartCount">السلة فاضية</span>
      <span class="total" id="cartTotalTop">0 ج</span>
    </div>
    <div class="cart-list" id="cartList"></div>
    <div class="cart-actions">
      <button class="btn-cancel" data-action="cart:cancel">إلغاء الطلب</button>
      <button class="btn-hold" id="holdBtn" data-action="cart:hold">تعليق الفاتورة</button>
      <button class="btn-checkout" id="checkoutBtn" data-action="checkout:open" disabled>إتمام البيع</button>
    </div>
  </div>
</div>

<div id="modalRoot"></div>

<script type="module" src="pages/cashier/main.js"></script>
</body>
</html>
